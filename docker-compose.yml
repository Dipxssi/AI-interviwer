services:
  postgres:
    image: postgres:16
    container_name: interviwer-db
    restart: unless-stopped
    ports:
      - "5434:5432"
    environment:
      POSTGRES_USER: interviwer
      POSTGRES_PASSWORD: interviwer
      POSTGRES_DB: interviwer
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: